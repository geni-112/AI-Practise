<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 数据专项作战平台</title><link rel="icon" type="image/svg+xml" href="/brand.svg"><link rel="stylesheet" href="/style.css"></head>
<body class="authpage"><div class="auth-language"><div class="language-switch" role="group" aria-label="界面语言"><button type="button" data-language="zh">中文</button><button type="button" data-language="en">English</button></div></div><div class="authlayout"><div class="authcard"><a class="brand" href="/"><img class="brand-mark" src="/brand.svg" width="40" height="40" alt=""><span>数据专项作战平台 <small lang="en">Data Solutions Hub</small></span></a><h2 id="authTitle">登录工作空间</h2><p class="subtitle" id="authHint">使用管理员授权的账号登录。</p><form id="loginForm"><div id="emailField"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="190" placeholder="name@company.com"></div><div id="displayNameField" hidden><label for="displayName">展示名 *</label><input id="displayName" name="displayName" autocomplete="nickname" maxlength="80"></div><label for="password" id="passwordLabel">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><div id="newPasswordField" hidden><label for="newPassword">新密码（至少 12 位）</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><div id="repeatField" hidden><label for="repeat">确认新密码</label><input id="repeat" type="password" autocomplete="new-password" maxlength="128"></div><p id="loginError" class="loginerror" role="alert"></p><button class="primary" id="loginButton"><span id="loginActionLabel">登录</span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/ui-icons.svg#arrow"></use></svg></button></form><section id="mfaPanel" hidden aria-labelledby="authTitle">
<p id="mfaDestination" data-user-content></p>
<p id="mfaNotice" class="viewnote" role="status"></p>
<form id="mfaCodeForm"><label for="mfaCode">邮箱验证码（6 位）</label><input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" spellcheck="false" required><button class="primary" type="submit">验证并继续</button></form>
<button type="button" id="mfaSend">发送验证码</button><p id="mfaCooldownRow" hidden><span>再次发送等待（秒）</span> <span id="mfaCooldown" data-user-content></span></p>
<p id="mfaError" class="loginerror" role="alert"></p></section><p class="viewnote" id="loginNote">新账号请使用管理员提供的初始密码登录；忘记密码时，请联系管理员重置。</p><button type="button" id="signOut" hidden>退出登录</button></div></div><script src="/i18n.js"></script><script src="/login.js"></script></body></html>
