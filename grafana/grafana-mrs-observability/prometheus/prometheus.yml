global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: monitor-host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: huawei-cloud
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["huawei-exporter:9108"]

  - job_name: mrs-manager-dump
    static_configs:
      - targets: ["mrs-dump-exporter:9109"]

  - job_name: dataarts-logs
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["dataarts-log-collector:9110"]
