<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 数据专项管理平台</title><link rel="stylesheet" href="/style.css"></head>
<body class="authpage"><div class="auth-language"><div class="language-switch" role="group" aria-label="界面语言"><button type="button" data-language="zh">中文</button><button type="button" data-language="en">English</button></div></div><div class="authlayout"><div class="authintro"><a class="brand" href="/"><i>▧</i><span>数据专项管理平台 <small>DATA PPL MANAGEMENT</small></span></a><div class="eyebrow">YOUR NEXT MOVE, IN FOCUS</div><h1>每一个项目，<br>都有清晰的下一步。</h1><p>连接项目、团队与经营数据。<br>让每一次推进都有依据。</p><div class="authjourney"><span>发现机会</span><b>→</b><span>推进项目</span><b>→</b><span>沉淀成果</span></div></div><div class="authcard"><span class="eyebrow">WELCOME TO YOUR WORKSPACE</span><h2 id="authTitle">登录工作空间</h2><p class="subtitle" id="authHint">使用管理员授权的账号登录。</p><form id="loginForm"><div id="emailField"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="190" placeholder="name@company.com"></div><label for="password" id="passwordLabel">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><div id="newPasswordField" hidden><label for="newPassword">新密码（至少 12 位）</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><div id="repeatField" hidden><label for="repeat">确认新密码</label><input id="repeat" type="password" autocomplete="new-password" maxlength="128"></div><p id="loginError" class="loginerror" role="alert"></p><button class="primary" id="loginButton">登录 →</button></form><p class="viewnote" id="loginNote">新账号请使用管理员提供的初始密码登录；忘记密码时，请联系管理员重置。</p><button type="button" id="signOut" hidden>退出登录</button></div></div><script src="/i18n.js"></script><script src="/login.js"></script></body></html>
