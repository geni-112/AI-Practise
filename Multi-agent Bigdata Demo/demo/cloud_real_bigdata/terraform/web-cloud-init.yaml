#cloud-config
package_update: true
packages:
  - nginx
  - python3
  - python3-venv
  - git
write_files:
  - path: /var/www/html/index.html
    permissions: "0644"
    content: |
      <!doctype html>
      <html>
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>SAT Agentic Real Big Data</title>
        <style>
          body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 48px; color: #18202a; }
          main { max-width: 760px; }
          code { background: #f2f4f7; padding: 2px 6px; border-radius: 6px; }
        </style>
      </head>
      <body>
        <main>
          <h1>SAT Agentic Real Big Data</h1>
          <p>The ECS web host is ready. Deploy the FastAPI application here after the OBS/MRS/DWS smoke run is complete.</p>
          <p>Execution layer: <code>OBS -> MRS Spark -> DWS/DataArts</code>.</p>
        </main>
      </body>
      </html>
runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
